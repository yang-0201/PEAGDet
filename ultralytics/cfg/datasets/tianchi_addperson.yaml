# COCO 2017 dataset https://cocodataset.org by Microsoft
# Documentation: https://docs.ultralytics.com/datasets/detect/coco/
# Example usage: yolo train data=coco.yaml
# parent
# ├── ultralytics
# └── datasets
#     └── coco  ← downloads here (20.1 GB)

# Train/val/test sets as 1) dir: path/to/imgs, 2) file: path/to/imgs.txt, or 3) list: [path/to/imgs1, path/to/imgs2, ..]
path: E:/ # dataset root dir
train:
  - datasets/images/train
  - ComfyUI-aki(1)\ComfyUI-aki-v1.6\ComfyUI\output\tianchi_addperson/images # train images (relative to 'path') 118287 images
val: datasets/images/val # val images (relative to 'path') 5000 images
test: images/test # 20288 of 40670 images, submit to https://competitions.codalab.org/competitions/20794

# Classes
names:
  0: person
  1: cyclist
  2: car
  3: truck
  4: bus
