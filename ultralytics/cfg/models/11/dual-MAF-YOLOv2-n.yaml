# Parameters
ch: 6
nc: 5 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
#  n: [0.33, 0.25, 1024]
  n: [1, 0.25, 1024]
# YOLOv8.0n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Dual_in, [6]] # 0-P1/2
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 1, RepHMS, [128, 2, 1, 3, 3]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 1, RepHMS, [256, 3, 1, 3, 5]]
  - [-1, 1, SCDown, [512, 3, 2]] # 5-P4/16
  - [-1, 1, RepHMS, [512, 3, 1, 3, 7]]
  - [-1, 1, SCDown, [1024, 3, 2]] # 7-P5/32
  - [-1, 1, RepHMS, [1024, 2, 1, 3, 9]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 1, PSA, [1024]] # 10

# YOLOv8.0n head
head:
  - [7, 1, AVG, []]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 1, RepHMS, [512, 2, 1, 3, 9]] #13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [11, 1, nn.Upsample, [None, 2, "nearest"]]
  - [5, 1, AVG, []]
  - [[-1, 7, -2, -3], 1, Concat, [1]]
  - [-1, 1, RepHMS, [384, 2, 1, 3, 7]] #18

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [7, 1, nn.Upsample, [None, 2, "nearest"]]
  - [3, 1, AVG, []]
  - [[-1, 5, -2, -3], 1, Concat, [1]]
  - [-1, 1, RepHMS, [384, 2, 1, 3, 5]] #23

  - [19, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, -2], 1, Concat, [1]]
  - [-1, 1, RepHMS, [384, 2, 1, 3, 5]] # 26

  - [-1, 1, Conv, [384, 3, 2]]
  - [24, 1, AVG, []]
  - [14, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-2, -1, 19, -3], 1, Concat, [1]]
  - [-1, 1, RepHMS, [384, 2, 1, 3, 7]] # 31

  - [-1, 1, Conv, [384, 3, 2]]
  - [19, 1, AVG, []]
  - [[-2, -1, 14], 1, Concat, [1]]
  - [-1, 1, RepHMS, [512, 2, 1, 3, 9]] # 35

  - [[27, 32, 36], 1, v10Detect, [nc]] # Detect(P3, P4, P5)
