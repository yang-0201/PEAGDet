# Parameters
ch: 6
nc: 5 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
#  n: [0.33, 0.25, 1024]
  n: [1, 0.25, 1024]
# YOLOv8.0n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Dual_in, [6]] # 0-P1/2
  - [-1, 1, Dual_out, [1]] # 0-P1/2
  - [-2, 1, Dual_out, [2]] # 0-P1/2

  - [1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 1, RepHMS, [128, 2, 1, 3, 3]]   # 5
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 1, RepHMS, [256, 3, 1, 3, 5]]
  - [-1, 1, SCDown, [512, 3, 2]] # 5-P4/16
  - [-1, 1, RepHMS, [512, 3, 1, 3, 7]]
  - [-1, 1, SCDown, [1024, 3, 2]] # 7-P5/32
  - [-1, 1, RepHMS, [1024, 2, 1, 3, 9]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 1, PSA, [1024]] # 13

  - [2, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 1, RepHMS, [128, 2, 1, 3, 3]]  # 16
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 1, RepHMS, [256, 3, 1, 3, 5]]
  - [-1, 1, SCDown, [512, 3, 2]] # 5-P4/16
  - [-1, 1, RepHMS, [512, 3, 1, 3, 7]]#     20
  - [-1, 1, SCDown, [1024, 3, 2]] # 7-P5/32
  - [-1, 1, RepHMS, [1024, 2, 1, 3, 9]]#     22
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 1, PSA, [1024]] #     24

  - [ [ 5, 16 ], 1, Concat, [ 1 ] ]  # 16 - >25
  - [ [ 7, 18 ], 1, Concat, [ 1 ] ]  #18- >26
  - [ [ 9, 20 ], 1, Concat, [ 1 ] ]  #20 - >27
  - [ [ 13, 24 ], 1, Concat, [ 1 ] ]  #24 - >28   +13  + 17



# YOLOv8.0n head
head:
