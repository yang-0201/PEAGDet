  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [27, 1, nn.Upsample, [None, 2, "nearest"]]
  - [25, 1, AVG, []]
  - [[-1, 26, -2, -3], 1, Concat, [1]]
